<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepound</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .phone-container {
      width: 375px;
      height: 730px;
      background-color: #fff;
      border-radius: 36px;
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
      border: 8px solid #333;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .app-header {
      padding: 18px 20px 10px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
      border-bottom: 1px solid #f0f0f0;
    }

    .tab-nav {
      display: flex;
      background: #f8f9fa;
      border-bottom: 1px solid #eee;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 2px;
      text-align: center;
      font-size: 9px;
      font-weight: bold;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
      background: #fff;
    }

    .tab-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
    }

    .content-area {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .memo-input {
      width: 100%;
      height: 75px;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.5;
      color: #222;
    }

    .section-header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-title {
      font-size: 12px;
      font-weight: bold;
      color: #777;
    }

    .category-select-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      min-height: 30px;
    }

    .cat-chip {
      font-size: 12px;
      background: #f1f3f4;
      color: #333;
      padding: 5px 10px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid #e0e0e0;
    }

    .cat-chip.active {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
      font-weight: bold;
    }

    .cat-chip.new-rec {
      background: #e6f4ea;
      color: #137333;
      border: 1px dashed #34a853;
    }

    .add-cat-btn {
      font-size: 11px;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 5px 9px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px dashed #1a73e8;
      font-weight: bold;
    }

    .recent-memos-list,
    .memo-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .recent-card {
      background: #f8f9fa;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 3px solid #1a73e8;
      cursor: pointer;
      gap: 8px;
    }

    .recent-card:hover {
      background: #f1f5fb;
    }

    .persistent-dock {
      margin-top: auto;
      background: #fff8f8;
      border-top: 2px dashed #ffcdd2;
      border-radius: 16px 16px 0 0;
      padding: 12px;
      max-height: 180px;
      overflow-y: auto;
    }

    .dock-title {
      font-size: 12px;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .memo-item {
      background: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .memo-text-clickable {
      cursor: pointer;
      flex: 1;
      word-break: break-word;
    }

    .memo-text-clickable:hover {
      text-decoration: underline;
    }

    .classify-btn {
      font-size: 11px;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      margin-right: 4px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 13px;
    }

    .delete-btn:hover {
      color: #d32f2f;
    }

    .category-grid {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .category-folder-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e9ecef;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.03);
    }

    .edit-icon-btn {
      cursor: pointer;
      font-size: 12px;
      color: #888;
      margin-left: 6px;
    }

    .back-btn {
      font-size: 12px;
      color: #1a73e8;
      background: none;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box-container {
      position: relative;
      padding: 12px 16px 4px;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 20px;
      border: 1px solid #ddd;
      font-size: 13px;
      outline: none;
    }

    .history-popup {
      display: none;
      position: absolute;
      top: 48px;
      left: 16px;
      right: 16px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      z-index: 100;
      padding: 6px 0;
    }

    .history-item {
      padding: 8px 14px;
      font-size: 12px;
      color: #555;
      display: flex;
      justify-content: space-between;
    }

    .sort-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 6px;
    }

    .sort-btn {
      font-size: 11px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
    }

    .sort-btn.active {
      color: #1a73e8;
      font-weight: bold;
    }

    .timestamp-box {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      text-align: right;
    }

    .tag-badge {
      font-size: 10px;
      background: #e8f0fe;
      color: #1a73e8;
      padding: 2px 6px;
      border-radius: 8px;
      margin-left: 4px;
      cursor: pointer;
    }

    /* 모달 */

    .memo-modal-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .memo-sticky-note {
      width: 280px;
      background: #fffde7;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,.2);
      border: 1px solid #fff59d;
    }

    .sticky-header {
      font-size: 13px;
      font-weight: bold;
      color: #f57f17;
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sticky-textarea {
      width: 100%;
      height: 100px;
      border: 1px solid #fff59d;
      background: #fff;
      border-radius: 8px;
      padding: 8px;
      font-size: 14px;
      outline: none;
      resize: none;
    }

    .sticky-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 10px;
    }

    .sticky-btn {
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
    }

    .sticky-btn.save {
      background: #1a73e8;
      color: #fff;
      font-weight: bold;
    }

    .sticky-btn.cancel {
      background: #e0e0e0;
      color: #666;
    }

    .cat-modal-card,
    .link-modal-card {
      width: 300px;
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }

    .cat-modal-title,
    .link-modal-title {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 12px;
    }

    .cat-input-field {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      margin-top: 5px;
    }

    .emoji-rec-box {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .emoji-btn {
      font-size: 20px;
      padding: 4px 8px;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #f8f9fa;
      cursor: pointer;
    }

    .emoji-btn.selected {
      background: #e8f0fe;
      border-color: #1a73e8;
    }

    /* 생각의 흐름 */

    .thought-refresh-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px 4px;
      gap: 6px;
    }

    .thought-toolbar {
      display: flex;
      gap: 5px;
    }

    .thought-refresh-btn {
      border: none;
      background: #e8f0fe;
      color: #1a73e8;
      border-radius: 16px;
      padding: 7px 9px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .thought-description {
      padding: 4px 16px 10px;
      font-size: 11px;
      color: #888;
      line-height: 1.5;
    }

    .thought-summary {
      margin: 0 16px 8px;
      padding: 10px 12px;
      background: #f8f9fa;
      border-radius: 10px;
      font-size: 10px;
      color: #777;
      line-height: 1.5;
    }

    .thought-flow-list {
      padding: 8px 16px 20px;
    }

    .thought-group {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      border: 1px solid #eee;
    }

    .thought-group-title {
      font-size: 14px;
      font-weight: bold;
      color: #333;
      margin-bottom: 4px;
    }

    .thought-group-info {
      font-size: 10px;
      color: #999;
      margin-bottom: 12px;
    }

    .thought-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .thought-card {
      width: 100%;
      background: #fff;
      border: 1px solid #e3e7eb;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,.05);
      cursor: pointer;
    }

    .thought-card:hover {
      border-color: #1a73e8;
    }

    .thought-card-date {
      font-size: 10px;
      color: #999;
      margin-bottom: 6px;
    }

    .thought-card-text {
      font-size: 13px;
      line-height: 1.5;
      color: #333;
      word-break: break-word;
    }

    .thought-card-category {
      margin-top: 8px;
      font-size: 10px;
      color: #1a73e8;
    }

    .thought-link-info {
      margin-top: 7px;
      font-size: 9px;
      color: #137333;
    }

    .thought-card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
    }

    .thought-action-btn {
      border: none;
      border-radius: 10px;
      padding: 5px 7px;
      font-size: 10px;
      cursor: pointer;
      background: #f1f3f4;
      color: #555;
    }

    .thought-action-btn.primary {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .thought-action-btn.connected {
      background: #e6f4ea;
      color: #137333;
    }

    .thought-arrow {
      height: 32px;
      display: flex;
      align-items: center;
      color: #1a73e8;
      font-size: 20px;
      font-weight: bold;
    }

    .thought-change-summary {
      margin-top: 10px;
      padding: 9px 10px;
      background: #fff8e1;
      border-radius: 9px;
      color: #795548;
      font-size: 10px;
      line-height: 1.5;
    }

    .thought-empty {
      margin: 20px 0;
      padding: 24px 16px;
      text-align: center;
      background: #f8f9fa;
      border-radius: 14px;
      color: #999;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 연결 모달 */

    .link-modal-card {
      max-height: 540px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .link-modal-description {
      font-size: 10px;
      color: #888;
      line-height: 1.5;
    }

    .link-memo-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 330px;
      padding: 2px;
    }

    .link-memo-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 9px;
      border: 1px solid #eee;
      border-radius: 9px;
      cursor: pointer;
      background: #fafafa;
    }

    .link-memo-option:hover {
      border-color: #1a73e8;
      background: #f8fbff;
    }

    .link-memo-option input {
      margin-top: 2px;
      accent-color: #1a73e8;
    }

    .link-memo-option-text {
      flex: 1;
      min-width: 0;
    }

    .link-memo-option-main {
      font-size: 11px;
      color: #333;
      line-height: 1.4;
      word-break: break-word;
    }

    .link-memo-option-meta {
      margin-top: 3px;
      font-size: 9px;
      color: #999;
    }

    .link-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .link-modal-btn {
      border: none;
      border-radius: 14px;
      padding: 7px 13px;
      font-size: 11px;
      cursor: pointer;
    }

    .link-modal-btn.cancel {
      background: #eee;
      color: #666;
    }

    .link-modal-btn.save {
      background: #1a73e8;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="phone-container">

  <div class="app-header">Notepound</div>

  <div class="tab-nav">
    <div id="tabWrite" class="tab-btn active" onclick="switchTab('write')">
      📝 메모 작성
    </div>

    <div id="tabCategory" class="tab-btn" onclick="switchTab('category')">
      🗂️ 카테고리
    </div>

    <div id="tabSearch" class="tab-btn" onclick="switchTab('search')">
      🔍 전체 메모
    </div>

    <div id="tabThought" class="tab-btn" onclick="switchTab('thought')">
      🧠 생각 흐름
    </div>
  </div>

  <!-- 메모 작성 -->

  <div id="pageWrite" class="tab-content active">

    <div class="content-area">

      <textarea
        id="memoInput"
        class="memo-input"
        placeholder="생각을 던져놓으세요... (엔터 누르면 바로 저장)"
      ></textarea>

      <div
        id="categoryHeaderBox"
        class="section-header-box"
        style="display:none;"
      >
        <span class="section-title">
          ✨ 스마트 카테고리 추천
        </span>

        <span
          class="add-cat-btn"
          onclick="openNewCategoryModal()"
        >
          + 수동 추가
        </span>
      </div>

      <div
        id="categoryChips"
        class="category-select-container"
      ></div>

      <div class="section-title">
        ⚡ 최근 작성한 메모
      </div>

      <div
        id="recentMemoList"
        class="recent-memos-list"
      ></div>

      <div class="persistent-dock">

        <div class="dock-title">
          <span>📌 분류가 필요한 메모</span>
          <span id="unclassifiedCount">0</span>
        </div>

        <div
          id="unclassifiedMemoList"
          class="memo-list"
        ></div>

      </div>

    </div>

  </div>

  <!-- 카테고리 -->

  <div id="pageCategory" class="tab-content">

    <div style="padding:12px 16px 0;text-align:right;">
      <button
        class="add-cat-btn"
        onclick="openNewCategoryModal()"
      >
        + 새 카테고리 만들기
      </button>
    </div>

    <div
      id="categoryGrid"
      class="category-grid"
    ></div>

  </div>

  <!-- 카테고리 상세 -->

  <div id="pageCategoryDetail" class="tab-content">

    <div
      style="
        padding:14px 16px 8px;
        border-bottom:1px solid #eee;
        display:flex;
        justify-content:space-between;
        align-items:center;
      "
    >

      <button
        class="back-btn"
        onclick="backToCategoryList()"
      >
        ← 카테고리 목록
      </button>

      <button
        class="add-cat-btn"
        id="addMemoInDetailBtn"
      >
        + 메모 추가
      </button>

    </div>

    <div class="content-area">

      <div class="section-header-box">

        <div
          class="section-title"
          id="detailCategoryTitle"
          style="font-size:14px;color:#333;"
        ></div>

        <span
          class="edit-icon-btn"
          id="editDetailCatBtn"
        >
          ✏️ 수정
        </span>

      </div>

      <div
        id="detailMemoList"
        class="memo-list"
      ></div>

    </div>

  </div>

  <!-- 전체 메모 -->

  <div id="pageSearch" class="tab-content">

    <div class="search-box-container">

      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="검색어를 입력하세요"
        onfocus="showHistoryPopup()"
        oninput="handleSearch()"
      >

      <div
        id="historyPopup"
        class="history-popup"
      ></div>

    </div>

    <div
      class="content-area"
      style="padding-top:4px;"
    >

      <div class="sort-bar">

        <span class="section-title">
          🕒 전체 메모
        </span>

        <div>
          <button
            id="sortNewest"
            class="sort-btn active"
            onclick="setSortOrder('newest')"
          >
            최신순
          </button>

          <span style="font-size:10px;color:#ccc;">|</span>

          <button
            id="sortOldest"
            class="sort-btn"
            onclick="setSortOrder('oldest')"
          >
            오래된순
          </button>
        </div>

      </div>

      <div
        id="allMemosList"
        class="memo-list"
      ></div>

    </div>

  </div>

  <!-- 생각의 흐름 -->

  <div id="pageThought" class="tab-content">

    <div class="thought-refresh-area">

      <div class="section-title">
        🧠 생각의 흐름
      </div>

      <div class="thought-toolbar">

        <button
          class="thought-refresh-btn"
          onclick="collectThoughtRecords()"
        >
          🔗 기록 모으기
        </button>

        <button
          class="thought-refresh-btn"
          onclick="refreshThoughtFlow()"
        >
          🔄 새로고침
        </button>

      </div>

    </div>

    <div class="thought-description">
      비슷한 내용을 자동으로 찾아 연결하고,
      원하는 메모끼리는 직접 연결할 수 있어요.<br>
      직접 연결한 기록은 언제든 다시 연결을 풀 수 있습니다.
    </div>

    <div
      id="thoughtSummary"
      class="thought-summary"
    ></div>

    <div
      id="thoughtFlowList"
      class="thought-flow-list"
    ></div>

  </div>

  <!-- 메모 연결 모달 -->

  <div
    id="linkMemoModalOverlay"
    class="memo-modal-overlay"
  >

    <div class="link-modal-card">

      <div
        class="link-modal-title"
        id="linkModalTitle"
      >
        🔗 메모 연결하기
      </div>

      <div class="link-modal-description">
        이 기록과 함께 묶고 싶은 메모를 여러 개 선택하세요.<br>
        체크를 해제하면 기존 연결도 풀립니다.
      </div>

      <div
        id="linkMemoList"
        class="link-memo-list"
      ></div>

      <div class="link-modal-actions">

        <button
          class="link-modal-btn cancel"
          onclick="closeLinkMemoModal()"
        >
          취소
        </button>

        <button
          class="link-modal-btn save"
          onclick="saveMemoLinks()"
        >
          연결 저장
        </button>

      </div>

    </div>

  </div>

  <!-- 메모 수정 모달 -->

  <div
    id="memoModalOverlay"
    class="memo-modal-overlay"
  >

    <div class="memo-sticky-note">

      <div class="sticky-header">

        <span>📌 메모 수정하기</span>

        <span
          style="cursor:pointer;"
          onclick="closeMemoModal()"
        >
          ✕
        </span>

      </div>

      <textarea
        id="modalTextarea"
        class="sticky-textarea"
      ></textarea>

      <div class="sticky-actions">

        <button
          class="sticky-btn cancel"
          onclick="closeMemoModal()"
        >
          취소
        </button>

        <button
          class="sticky-btn save"
          onclick="saveMemoModal()"
        >
          저장
        </button>

      </div>

    </div>

  </div>

  <!-- 카테고리 모달 -->

  <div
    id="catModalOverlay"
    class="memo-modal-overlay"
  >

    <div class="cat-modal-card">

      <div
        class="cat-modal-title"
        id="catModalHeaderTitle"
      >
        📂 카테고리 설정
      </div>

      <div>

        <span
          style="font-size:11px;color:#666;font-weight:bold;"
        >
          카테고리 이름
        </span>

        <input
          type="text"
          id="newCatNameInput"
          class="cat-input-field"
          placeholder="예: 일기, 컴활, 운동..."
          oninput="updateEmojiRecommendations()"
        >

      </div>

      <div>

        <span
          style="font-size:11px;color:#666;font-weight:bold;"
        >
          추천 이모지
        </span>

        <div
          id="emojiRecBox"
          class="emoji-rec-box"
        ></div>

      </div>

      <div class="sticky-actions">

        <button
          class="sticky-btn cancel"
          onclick="closeCatModal()"
        >
          취소
        </button>

        <button
          class="sticky-btn save"
          onclick="submitCategoryModal()"
        >
          완료
        </button>

      </div>

    </div>

  </div>

</div>

<script>
/* =====================================================
   기본 데이터
   ===================================================== */

let savedMemos =
  JSON.parse(localStorage.getItem('notepound_memos')) || [];

let categories =
  JSON.parse(localStorage.getItem('notepound_categories')) || [
    { name: '일정', icon: '📅' },
    { name: '아이디어', icon: '💡' },
    { name: '좋아하는 음식', icon: '🍕' },
    { name: '위시리스트', icon: '🛍️' }
  ];

let searchHistory =
  JSON.parse(localStorage.getItem('notepound_search_history')) || [];

let currentSelectedCategory = '';
let isUserManuallySelected = false;
let activeCategoryDetail = '';
let currentSortOrder = 'newest';
let editingMemoIndex = null;
let selectedEmoji = '📁';
let editingCategoryIndex = null;
let linkingMemoId = null;


/* =====================================================
   데이터 정리 / 저장
   ===================================================== */

function normalizeMemoData() {

  savedMemos = savedMemos.map(memo => {

    const linked =
      Array.isArray(memo.linkedMemos)
        ? memo.linkedMemos
            .map(Number)
            .filter(id => !Number.isNaN(id))
        : [];

    return {
      ...memo,
      linkedMemos: [...new Set(linked)]
    };

  });

  const validIds =
    new Set(savedMemos.map(memo => memo.id));

  savedMemos.forEach(memo => {

    memo.linkedMemos =
      memo.linkedMemos.filter(
        id =>
          validIds.has(id) &&
          id !== memo.id
      );

  });

}

normalizeMemoData();


function saveMemos() {

  localStorage.setItem(
    'notepound_memos',
    JSON.stringify(savedMemos)
  );

}


function createMemoId() {

  let id = Date.now();

  while (
    savedMemos.some(memo => memo.id === id)
  ) {
    id++;
  }

  return id;

}


/* =====================================================
   HTML 안전 처리
   ===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement('div');

  div.textContent =
    text == null ? '' : String(text);

  return div.innerHTML;

}


/* =====================================================
   탭 전환
   ===================================================== */

function switchTab(tabName) {

  const tabs = {
    write: 'tabWrite',
    category: 'tabCategory',
    categoryDetail: 'tabCategory',
    search: 'tabSearch',
    thought: 'tabThought'
  };

  const pages = {
    write: 'pageWrite',
    category: 'pageCategory',
    categoryDetail: 'pageCategoryDetail',
    search: 'pageSearch',
    thought: 'pageThought'
  };

  Object.values(tabs).forEach(id => {
    document
      .getElementById(id)
      .classList.remove('active');
  });

  Object.values(pages).forEach(id => {
    document
      .getElementById(id)
      .classList.remove('active');
  });

  document
    .getElementById(tabs[tabName])
    .classList.add('active');

  document
    .getElementById(pages[tabName])
    .classList.add('active');

  hideHistoryPopup();

  if (tabName === 'category') {
    renderCategoryPage();
  }

  if (tabName === 'search') {
    renderAllMemosPage();
  }

  if (tabName === 'thought') {
    renderThoughtFlow();
  }

}


/* =====================================================
   카테고리
   ===================================================== */

function openNewCategoryModal() {

  editingCategoryIndex = null;

  document.getElementById(
    'catModalHeaderTitle'
  ).textContent =
    '📂 새 카테고리 추가';

  document.getElementById(
    'newCatNameInput'
  ).value = '';

  selectedEmoji = '📁';

  updateEmojiRecommendations();

  document.getElementById(
    'catModalOverlay'
  ).style.display = 'flex';

  setTimeout(() => {
    document
      .getElementById('newCatNameInput')
      .focus();
  }, 100);

}


function editCategoryNamePrompt(index) {

  editingCategoryIndex = index;

  const cat = categories[index];

  if (!cat) return;

  document.getElementById(
    'catModalHeaderTitle'
  ).textContent =
    '✏️ 카테고리 수정';

  document.getElementById(
    'newCatNameInput'
  ).value = cat.name;

  selectedEmoji = cat.icon;

  updateEmojiRecommendations();

  document.getElementById(
    'catModalOverlay'
  ).style.display = 'flex';

}


function closeCatModal() {

  document.getElementById(
    'catModalOverlay'
  ).style.display = 'none';

  editingCategoryIndex = null;

}


function updateEmojiRecommendations() {

  const input =
    document.getElementById(
      'newCatNameInput'
    );

  const box =
    document.getElementById(
      'emojiRecBox'
    );

  if (!input || !box) return;

  const name =
    input.value.trim();

  let emojis = [
    '📁',
    '📌',
    '✨',
    '🏷️',
    '📝'
  ];

  if (
    name.includes('일기') ||
    name.includes('일상') ||
    name.includes('생각') ||
    name.includes('기록')
  ) {

    emojis = [
      '📖',
      '📔',
      '✏️',
      '💭',
      '📝'
    ];

  } else if (
    name.includes('학교') ||
    name.includes('과제') ||
    name.includes('공부') ||
    name.includes('시험') ||
    name.includes('컴활')
  ) {

    emojis = [
      '🎓',
      '📚',
      '💻',
      '✍️',
      '🎯'
    ];

  } else if (
    name.includes('음식') ||
    name.includes('먹') ||
    name.includes('맛집') ||
    name.includes('카페')
  ) {

    emojis = [
      '🍕',
      '🍰',
      '☕',
      '🍧',
      '🍲'
    ];

  } else if (
    name.includes('운동') ||
    name.includes('헬스') ||
    name.includes('러닝')
  ) {

    emojis = [
      '⚽',
      '🏋️',
      '🏃',
      '🥊',
      '🧘'
    ];

  } else if (
    name.includes('쇼핑') ||
    name.includes('위시') ||
    name.includes('구매')
  ) {

    emojis = [
      '🛍️',
      '🛒',
      '💳',
      '🎁',
      '👗'
    ];

  } else if (
    name.includes('영화') ||
    name.includes('드라마') ||
    name.includes('게임') ||
    name.includes('아이디어')
  ) {

    emojis = [
      '💡',
      '🎬',
      '🍿',
      '🎮',
      '🎧'
    ];

  } else if (
    name.includes('알바') ||
    name.includes('업무') ||
    name.includes('일정')
  ) {

    emojis = [
      '📅',
      '💼',
      '⏰',
      '💰',
      '🍔'
    ];

  }

  if (!emojis.includes(selectedEmoji)) {
    emojis.unshift(selectedEmoji);
  }

  box.innerHTML = '';

  emojis.forEach(emoji => {

    const button =
      document.createElement('button');

    button.type = 'button';
    button.className =
      'emoji-btn' +
      (
        selectedEmoji === emoji
          ? ' selected'
          : ''
      );

    button.textContent = emoji;

    button.onclick = () => {

      selectedEmoji = emoji;

      updateEmojiRecommendations();

    };

    box.appendChild(button);

  });

}


function submitCategoryModal() {

  const name =
    document.getElementById(
      'newCatNameInput'
    ).value.trim();

  if (!name) {
    alert('카테고리 이름을 입력해주세요.');
    return;
  }

  const wasEditing =
    editingCategoryIndex !== null;

  if (wasEditing) {

    const oldCat =
      categories[editingCategoryIndex];

    if (!oldCat) return;

    const oldFullName =
      `${oldCat.icon} ${oldCat.name}`;

    const newFullName =
      `${selectedEmoji} ${name}`;

    savedMemos.forEach(memo => {

      if (
        memo.category === oldFullName
      ) {
        memo.category = newFullName;
      }

    });

    categories[editingCategoryIndex] = {
      name,
      icon: selectedEmoji
    };

    if (
      activeCategoryDetail === oldFullName
    ) {
      activeCategoryDetail = newFullName;
    }

  } else {

    categories.push({
      name,
      icon: selectedEmoji
    });

  }

  localStorage.setItem(
    'notepound_categories',
    JSON.stringify(categories)
  );

  saveMemos();

  const newCategoryFullName =
    `${selectedEmoji} ${name}`;

  closeCatModal();

  renderCategoryPage();
  renderWritePage();

  if (
    memoInput.value.trim() &&
    !wasEditing
  ) {

    currentSelectedCategory =
      newCategoryFullName;

    isUserManuallySelected = true;

    renderLiveCategoryChips();

  }

  if (
    activeCategoryDetail &&
    wasEditing
  ) {
    openCategoryDetail(
      activeCategoryDetail
    );
  }

}


/* =====================================================
   메모 입력 / 스마트 카테고리
   ===================================================== */

const memoInput =
  document.getElementById('memoInput');


memoInput.addEventListener(
  'input',
  () => {

    const text =
      memoInput.value.trim();

    const header =
      document.getElementById(
        'categoryHeaderBox'
      );

    if (!text) {

      header.style.display = 'none';

      document.getElementById(
        'categoryChips'
      ).innerHTML = '';

      currentSelectedCategory = '';
      isUserManuallySelected = false;

      return;

    }

    header.style.display = 'flex';

    let dynamicNewCat = null;

    if (!isUserManuallySelected) {

      if (
        text.includes('과제') ||
        text.includes('시험') ||
        text.includes('약속') ||
        text.includes('오늘')
      ) {

        currentSelectedCategory =
          findCategoryFullName('일정') ||
          findCategoryFullName('📅');

      } else if (
        text.includes('먹') ||
        text.includes('음식') ||
        text.includes('맛집')
      ) {

        currentSelectedCategory =
          findCategoryFullName('음식') ||
          findCategoryFullName('🍕');

      } else if (
        text.includes('사고') ||
        text.includes('살까') ||
        text.includes('위시')
      ) {

        currentSelectedCategory =
          findCategoryFullName('위시') ||
          findCategoryFullName('🛍️');

      } else if (
        text.includes('생각') ||
        text.includes('아이디어')
      ) {

        currentSelectedCategory =
          findCategoryFullName('아이디어') ||
          findCategoryFullName('💡');

      } else {

        const newCategory =
          extractNewCategoryKeyword(text);

        if (newCategory) {

          const exists =
            categories.some(
              c =>
                c.name === newCategory.name
            );

          if (!exists) {
            dynamicNewCat =
              `${newCategory.icon} ${newCategory.name}`;
          }

        }

      }

    }

    renderLiveCategoryChips(
      dynamicNewCat
    );

  }
);


function extractNewCategoryKeyword(text) {

  if (
    text.includes('수원대') ||
    text.includes('학교')
  ) {
    return {
      name: '학교',
      icon: '🎓'
    };
  }

  if (
    text.includes('운동') ||
    text.includes('헬스')
  ) {
    return {
      name: '운동',
      icon: '⚽'
    };
  }

  if (
    text.includes('영화') ||
    text.includes('게임')
  ) {
    return {
      name: '문화',
      icon: '🎬'
    };
  }

  if (
    text.includes('알바') ||
    text.includes('시급')
  ) {
    return {
      name: '아르바이트',
      icon: '💼'
    };
  }

  if (
    text.includes('일기') ||
    text.includes('오늘 하루')
  ) {
    return {
      name: '일기',
      icon: '📖'
    };
  }

  return null;

}


function findCategoryFullName(keyword) {

  const found =
    categories.find(
      category =>
        category.name.includes(keyword) ||
        category.icon.includes(keyword)
    );

  return found
    ? `${found.icon} ${found.name}`
    : null;

}


function renderLiveCategoryChips(
  dynamicNewCat = null
) {

  const container =
    document.getElementById(
      'categoryChips'
    );

  container.innerHTML = '';

  categories.forEach(category => {

    const fullName =
      `${category.icon} ${category.name}`;

    const chip =
      document.createElement('span');

    chip.className = 'cat-chip';

    if (
      currentSelectedCategory ===
      fullName
    ) {
      chip.classList.add('active');
    }

    chip.textContent = fullName;

    chip.onclick = () => {

      currentSelectedCategory =
        fullName;

      isUserManuallySelected = true;

      renderLiveCategoryChips();

      memoInput.focus();

    };

    container.appendChild(chip);

  });

  if (dynamicNewCat) {

    const chip =
      document.createElement('span');

    chip.className =
      'cat-chip new-rec';

    chip.textContent =
      `✨ ${dynamicNewCat} (새로 추가)`;

    chip.onclick = () => {

      const parts =
        dynamicNewCat.split(' ');

      categories.push({
        name: parts.slice(1).join(' '),
        icon: parts[0]
      });

      localStorage.setItem(
        'notepound_categories',
        JSON.stringify(categories)
      );

      currentSelectedCategory =
        dynamicNewCat;

      isUserManuallySelected = true;

      renderLiveCategoryChips();

      memoInput.focus();

    };

    container.appendChild(chip);

  }

}


/* =====================================================
   시간
   ===================================================== */

function formatTimestamp(timestamp) {

  const d = new Date(timestamp);

  const yy =
    String(d.getFullYear()).slice(-2);

  const mm =
    String(d.getMonth() + 1).padStart(2, '0');

  const dd =
    String(d.getDate()).padStart(2, '0');

  const hh =
    String(d.getHours()).padStart(2, '0');

  const min =
    String(d.getMinutes()).padStart(2, '0');

  return `${yy}.${mm}.${dd}. ${hh}:${min}`;

}


/* =====================================================
   메모 저장
   ===================================================== */

function saveCurrentMemo() {

  const text =
    memoInput.value.trim();

  if (!text) return;

  const memo = {
    id: createMemoId(),
    text,
    category:
      currentSelectedCategory || '#미분류',
    tag: '',
    linkedMemos: []
  };

  savedMemos.push(memo);

  saveMemos();

  memoInput.value = '';

  currentSelectedCategory = '';
  isUserManuallySelected = false;

  document.getElementById(
    'categoryHeaderBox'
  ).style.display = 'none';

  document.getElementById(
    'categoryChips'
  ).innerHTML = '';

  renderWritePage();
  renderCategoryPage();
  renderAllMemosPage();

  if (
    document
      .getElementById('pageThought')
      .classList.contains('active')
  ) {
    renderThoughtFlow();
  }

}


/* 엔터 저장 */

memoInput.addEventListener(
  'keydown',
  event => {

    if (
      event.key === 'Enter' &&
      !event.shiftKey
    ) {

      event.preventDefault();

      saveCurrentMemo();

    }

  }
);


/* =====================================================
   메모 작성 화면
   ===================================================== */

function renderWritePage() {

  const recent =
    document.getElementById(
      'recentMemoList'
    );

  recent.innerHTML = '';

  [...savedMemos]
    .sort((a,b) => b.id - a.id)
    .slice(0,4)
    .forEach(memo => {

      const index =
        savedMemos.findIndex(
          m => m.id === memo.id
        );

      const item =
        document.createElement('div');

      item.className =
        'recent-card';

      item.onclick = () => {
        openMemoModal(index);
      };

      item.innerHTML = `
        <span style="flex:1;word-break:break-word;">
          ${escapeHtml(memo.text)}
        </span>
        <span style="font-size:10px;color:#777;white-space:nowrap;">
          ${escapeHtml(memo.category || '#미분류')}
        </span>
      `;

      recent.appendChild(item);

    });


  const unclassified =
    savedMemos.filter(
      memo =>
        !memo.category ||
        memo.category === '#미분류'
    );

  const list =
    document.getElementById(
      'unclassifiedMemoList'
    );

  list.innerHTML = '';

  unclassified.forEach(memo => {

    const index =
      savedMemos.findIndex(
        m => m.id === memo.id
      );

    const item =
      document.createElement('div');

    item.className =
      'memo-item';

    item.innerHTML = `
      <span
        class="memo-text-clickable"
        onclick="openMemoModal(${index})"
      >
        ${escapeHtml(memo.text)}
      </span>

      <div>
        <button
          class="classify-btn"
          onclick="assignCategoryDirect(${index})"
        >
          📂 분류
        </button>

        <button
          class="delete-btn"
          onclick="deleteMemo(${index})"
        >
          ✕
        </button>
      </div>
    `;

    list.prepend(item);

  });

  document.getElementById(
    'unclassifiedCount'
  ).textContent =
    unclassified.length;

}


/* =====================================================
   메모 수정
   ===================================================== */

function openMemoModal(index) {

  if (!savedMemos[index]) return;

  editingMemoIndex = index;

  document.getElementById(
    'modalTextarea'
  ).value =
    savedMemos[index].text;

  document.getElementById(
    'memoModalOverlay'
  ).style.display = 'flex';

}


function closeMemoModal() {

  document.getElementById(
    'memoModalOverlay'
  ).style.display = 'none';

  editingMemoIndex = null;

}


function saveMemoModal() {

  if (
    editingMemoIndex === null
  ) {
    closeMemoModal();
    return;
  }

  const text =
    document.getElementById(
      'modalTextarea'
    ).value.trim();

  if (!text) {
    alert('내용을 입력해주세요.');
    return;
  }

  savedMemos[
    editingMemoIndex
  ].text = text;

  saveMemos();

  closeMemoModal();

  renderWritePage();
  renderCategoryPage();
  renderDetailMemoList();
  renderAllMemosPage();

  if (
    document
      .getElementById('pageThought')
      .classList.contains('active')
  ) {
    renderThoughtFlow();
  }

}


/* =====================================================
   카테고리 직접 지정
   ===================================================== */

function assignCategoryDirect(index) {

  const options =
    categories
      .map(
        (cat,i) =>
          `${i+1}. ${cat.icon} ${cat.name}`
      )
      .join('\n');

  const choice =
    parseInt(
      prompt(
        `이 메모의 카테고리를 선택하세요.\n\n${options}`
      )
    );

  if (
    !choice ||
    choice < 1 ||
    choice > categories.length
  ) {
    return;
  }

  const cat =
    categories[choice - 1];

  savedMemos[index].category =
    `${cat.icon} ${cat.name}`;

  saveMemos();

  renderWritePage();
  renderCategoryPage();
  renderDetailMemoList();

}


/* =====================================================
   카테고리 화면
   ===================================================== */

function renderCategoryPage() {

  const grid =
    document.getElementById(
      'categoryGrid'
    );

  grid.innerHTML = '';

  categories.forEach(
    (cat,index) => {

      const fullName =
        `${cat.icon} ${cat.name}`;

      const count =
        savedMemos.filter(
          memo =>
            memo.category === fullName
        ).length;

      const card =
        document.createElement('div');

      card.className =
        'category-folder-card';

      card.innerHTML = `
        <div style="flex:1;cursor:pointer;">
          <span style="font-weight:bold;font-size:14px;">
            ${escapeHtml(fullName)}
          </span>

          <span style="font-size:12px;color:#888;margin-left:6px;">
            (${count})
          </span>
        </div>

        <div>
          <span
            class="edit-icon-btn"
            data-edit
          >
            ✏️
          </span>

          <span
            style="font-size:12px;color:#1a73e8;font-weight:bold;cursor:pointer;margin-left:8px;"
            data-open
          >
            이동 ›
          </span>
        </div>
      `;

      card
        .querySelector('[data-edit]')
        .onclick = event => {
          event.stopPropagation();
          editCategoryNamePrompt(index);
        };

      card
        .querySelector('[data-open]')
        .onclick = () => {
          openCategoryDetail(fullName);
        };

      card
        .querySelector('div')
        .onclick = () => {
          openCategoryDetail(fullName);
        };

      grid.appendChild(card);

    }
  );

}


function openCategoryDetail(
  categoryFullName
) {

  activeCategoryDetail =
    categoryFullName;

  document.getElementById(

function smartTagMultiSelectPrompt(index) {

  const memo =
    savedMemos[index];

  if (!memo) return;

  let recommendations = [
    '#중요',
    '#일정'
  ];

  if (
    memo.text.includes('과제') ||
    memo.text.includes('공부') ||
    memo.text.includes('시험')
  ) {

    recommendations = [
      '#공부',
      '#시험',
      '#과제',
      '#중요'
    ];

  } else if (
    memo.text.includes('먹') ||
    memo.text.includes('음식') ||
    memo.text.includes('카페')
  ) {

    recommendations = [
      '#맛집',
      '#먹고싶다',
      '#위시리스트'
    ];

  } else if (
    memo.text.includes('약속') ||
    memo.text.includes('오늘') ||
    memo.text.includes('내일')
  ) {

    recommendations = [
      '#일정',
      '#약속',
      '#주말'
    ];

  }

  const message =
    `추천 태그\n${recommendations.join(', ')}\n\n` +
    recommendations
      .map((tag,i) => `${i+1}. ${tag}`)
      .join('\n') +
    '\n\n원하는 태그를 입력하세요.';

  let input =
    prompt(
      message,
      memo.tag || ''
    );

  if (input === null) {
    return;
  }

  input = input.trim();

  const number =
    parseInt(input);

  if (
    number >= 1 &&
    number <= recommendations.length
  ) {
    input =
      recommendations[number - 1];
  }

  if (
    input &&
    !input.startsWith('#')
  ) {
    input = '#' + input;
  }

  memo.tag = input;

  saveMemos();

  renderDetailMemoList();

}

function deleteMemo(index) {

  const memo =
    savedMemos[index];

  if (!memo) return;

  const confirmed =
    confirm(
      '이 메모를 삭제할까요?'
    );

  if (!confirmed) {
    return;
  }

  const deletedId =
    memo.id;

  savedMemos.forEach(
    other => {

      if (
        Array.isArray(
          other.linkedMemos
        )
      ) {

        other.linkedMemos =
          other.linkedMemos.filter(
            id =>
              String(id) !==
              String(deletedId)
          );

      }

      if (
        String(other.replyTo) ===
        String(deletedId)
      ) {

        delete other.replyTo;

      }

    }
  );

  savedMemos.splice(
    index,
    1
  );

  saveMemos();

  renderWritePage();
  renderCategoryPage();
  renderAllMemosPage();

  if (activeCategoryDetail) {
    renderDetailMemoList();
  }

  renderThoughtFlow();

}


/* =====================================================
   생각의 흐름 - 자동 유사도 분석
   ===================================================== */

function normalizeThoughtText(text) {

  return String(text || '')
    .toLowerCase()
    .replace(/[^\p{L}\p{N}#]+/gu, ' ')
    .trim();

}


function tokenizeThoughtText(text) {

  const normalized =
    normalizeThoughtText(text);

  if (!normalized) {
    return [];
  }

  const raw =
    normalized.split(/\s+/);

  const tokens = [];

  raw.forEach(token => {

    if (token.length >= 2) {
      tokens.push(token);
    }

    /*
      한국어는 띄어쓰기가 일정하지 않기 때문에
      2글자 단위도 일부 추출
    */

    if (
      /^[가-힣]+$/.test(token) &&
      token.length >= 3
    ) {

      for (
        let i = 0;
        i < token.length - 1;
        i++
      ) {

        tokens.push(
          token.slice(i,i+2)
        );

      }

    }

  });

  return [
    ...new Set(tokens)
  ];

}


function getMeaningfulTokens(text) {

  const stopWords = new Set([
    '그리고',
    '근데',
    '그래서',
    '진짜',
    '너무',
    '정말',
    '그냥',
    '오늘',
    '내일',
    '같은',
    '대한',
    '하는',
    '했다',
    '있는',
    '있다',
    '싶다',
    '것',
    '거',
    '나',
    '내',
    '저',
    '이',
    '그',
    '좀',
    '더'
  ]);

  return tokenizeThoughtText(text)
    .filter(
      token =>
        !stopWords.has(token) &&
        token.length >= 2
    );

}


function getManualLinkedIds(memo) {

  if (
    !memo ||
    !Array.isArray(
      memo.linkedMemos
    )
  ) {
    return [];
  }

  return memo.linkedMemos
    .map(Number)
    .filter(
      id =>
        !Number.isNaN(id)
    );

}


function areManuallyLinked(
  a,
  b
) {

  return (
    getManualLinkedIds(a)
      .includes(b.id) ||
    getManualLinkedIds(b)
      .includes(a.id)
  );

}


function calculateThoughtSimilarity(
  a,
  b
) {

  const aTokens =
    new Set(
      getMeaningfulTokens(a.text)
    );

  const bTokens =
    new Set(
      getMeaningfulTokens(b.text)
    );

  const shared = [];

  aTokens.forEach(token => {

    if (
      bTokens.has(token)
    ) {
      shared.push(token);
    }

  });

  let score = 0;

  /*
    직접 연결은 가장 강한 관계
  */

  if (
    areManuallyLinked(a,b)
  ) {
    score += 100;
  }

  /*
    이어쓰기 관계
  */

  if (
    String(a.replyTo) ===
    String(b.id)
  ) {
    score += 80;
  }

  if (
    String(b.replyTo) ===
    String(a.id)
  ) {
    score += 80;
  }

  /*
    같은 카테고리
  */

  if (
    a.category &&
    b.category &&
    a.category === b.category &&
    a.category !== '#미분류'
  ) {
    score += 4;
  }

  /*
    같은 태그
  */

  if (
    a.tag &&
    b.tag &&
    a.tag === b.tag
  ) {
    score += 5;
  }

  /*
    공통 단어
  */

  score +=
    Math.min(
      shared.length * 3,
      18
    );

  return {
    score,
    shared
  };

}


function isThoughtRelated(
  a,
  b
) {

  const result =
    calculateThoughtSimilarity(
      a,
      b
    );

  if (
    areManuallyLinked(a,b)
  ) {
    return true;
  }

  if (
    String(a.replyTo) ===
    String(b.id) ||
    String(b.replyTo) ===
    String(a.id)
  ) {
    return true;
  }

  /*
    공통 핵심 단어가 2개 이상이면
    자동 연결
  */

  if (
    result.shared.length >= 2
  ) {
    return true;
  }

  /*
    같은 카테고리 + 공통 단어 1개
  */

  if (
    result.shared.length >= 1 &&
    a.category &&
    b.category &&
    a.category === b.category &&
    a.category !== '#미분류'
  ) {
    return true;
  }

  return false;

}


function findThoughtRelatedMemos(
  targetMemo,
  limit = 6
) {

  return savedMemos
    .filter(
      memo =>
        memo.id !== targetMemo.id
    )
    .map(
      memo => {

        const result =
          calculateThoughtSimilarity(
            targetMemo,
            memo
          );

        return {
          memo,
          score: result.score,
          shared: result.shared
        };

      }
    )
    .filter(
      item =>
        isThoughtRelated(
          targetMemo,
          item.memo
        )
    )
    .sort(
      (a,b) =>
        b.score - a.score ||
        b.memo.id - a.memo.id
    )
    .slice(0,limit);

}


/* =====================================================
   생각의 흐름 그룹 만들기
   ===================================================== */

function buildThoughtGroups() {

  const groups = [];

  const visited =
    new Set();

  savedMemos.forEach(startMemo => {

    if (
      visited.has(startMemo.id)
    ) {
      return;
    }

    const group = [];
    const queue = [startMemo];

    visited.add(
      startMemo.id
    );

    while (
      queue.length
    ) {

      const current =
        queue.shift();

      group.push(current);

      savedMemos.forEach(candidate => {

        if (
          visited.has(candidate.id) ||
          candidate.id === current.id
        ) {
          return;
        }

        if (
          isThoughtRelated(
            current,
            candidate
          )
        ) {

          visited.add(
            candidate.id
          );

          queue.push(
            candidate
          );

        }

      });

    }

    if (
      group.length >= 2
    ) {

      group.sort(
        (a,b) =>
          a.id - b.id
      );

      groups.push(group);

    }

  });

  groups.sort(
    (a,b) =>
      a[0].id - b[0].id
  );

  return groups;

}


/* =====================================================
   생각 흐름 제목
   ===================================================== */

function getThoughtKeywords(text) {

  return getMeaningfulTokens(text)
    .filter(
      token =>
        token.length >= 2
    );

}


function getThoughtGroupTitle(
  group
) {

  const count = {};

  group.forEach(memo => {

    getThoughtKeywords(
      memo.text
    ).forEach(keyword => {

      count[keyword] =
        (count[keyword] || 0) + 1;

    });

  });

  const keywords =
    Object.keys(count)
      .sort(
        (a,b) =>
          count[b] - count[a]
      );

  if (
    keywords.length
  ) {

    return `
      💭 ${escapeHtml(keywords[0])}에 대한 생각
    `;

  }

  if (
    group[0].category &&
    group[0].category !== '#미분류'
  ) {

    return `
      💭 ${escapeHtml(group[0].category)} 관련 생각
    `;

  }

  return '💭 이어지는 생각';

}


function formatThoughtDate(
  timestamp
) {

  const d =
    new Date(timestamp);

  return `
    ${String(d.getFullYear()).slice(-2)}.
    ${String(d.getMonth()+1).padStart(2,'0')}.
    ${String(d.getDate()).padStart(2,'0')}
  `;

}


/* =====================================================
   생각 변화 요약
   ===================================================== */

function detectThoughtMarkers(
  text
) {

  const groups = {

    '고민·불확실': [
      '고민',
      '모르',
      '헷갈',
      '걱정',
      '아직',
      '일까',
      '궁금'
    ],

    '긍정·관심': [
      '좋',
      '재밌',
      '괜찮',
      '하고 싶',
      '가고 싶',
      '마음에'
    ],

    '부담·부정': [
      '싫',
      '별로',
      '힘들',
      '어렵',
      '후회',
      '그만'
    ],

    '결정·행동': [
      '결정',
      '정했',
      '하기로',
      '할 거',
      '해야',
      '시작'
    ]

  };

  const found = [];

  const value =
    String(text || '');

  Object.entries(
    groups
  ).forEach(
    ([label, words]) => {

      if (
        words.some(
          word =>
            value.includes(word)
        )
      ) {

        found.push(label);

      }

    }
  );

  return found;

}


function summarizeThoughtChange(
  group
) {

  if (
    group.length < 2
  ) {
    return '';
  }

  const first =
    detectThoughtMarkers(
      group[0].text
    );

  const last =
    detectThoughtMarkers(
      group[group.length - 1].text
    );

  const parts = [];

  if (first.length) {

    parts.push(
      `처음 기록에는 ${first.join(', ')} 표현이 나타납니다.`
    );

  }

  if (last.length) {

    parts.push(
      `최근 기록에는 ${last.join(', ')} 표현이 나타납니다.`
    );

  }

  if (!parts.length) {

    parts.push(
      '시간이 지나면서 같은 주제에 대한 기록이 이어지고 있습니다.'
    );

  }

  return parts.join(' ');

}


/* =====================================================
   연결 관계 설명
   ===================================================== */

function getConnectionTypeLabel(
  memo,
  group
) {

  const directCount =
    getManualLinkedIds(memo)
      .filter(
        id =>
          group.some(
            item =>
              item.id === id
          )
      )
      .length;

  if (
    directCount
  ) {

    return `🔗 직접 연결 ${directCount}개`;

  }

  if (
    memo.replyTo &&
    group.some(
      item =>
        String(item.id) ===
        String(memo.replyTo)
    )
  ) {

    return '↩️ 이어서 작성한 기록';

  }

  return '✨ 자동으로 관련된 기록';

}


/* =====================================================
   생각의 흐름 렌더링

function renderThoughtFlow() {

    document.getElementById(
      'thoughtFlowList'
    );

    );

  if (!container) {

  }

    savedMemos.reduce(
      (total,memo) =>
        total +
        getManualLinkedIds(memo).length,
      0
    ) / 2;

  if (summary) {

    summary.innerHTML = `
      현재 ${savedMemos.length}개의 기록을 살펴보고 있어요.
      자동으로 관련된 기록과 직접 연결한 기록을 함께 보여줍니다.
      ${
        manualRelations
          ? `직접 연결된 관계는 ${manualRelations}개예요.`
          : '원하는 기록은 각 카드의 🔗 연결하기로 직접 연결할 수 있어요.'
      }
    `;

  }

  if (
    !savedMemos.length
  ) {

    container.innerHTML = `
      <div class="thought-empty">
        아직 저장된 메모가 없어요.<br><br>
        메모를 작성하면 관련 기록을 찾아<br>
        생각의 흐름으로 보여드릴게요.
      </div>
    `;

    return;

  }

  const groups =
    buildThoughtGroups();

  groups.forEach(
    group => {

      const box =
        document.createElement('div');

      box.className =
        'thought-group';

      box.innerHTML = `
        <div class="thought-group-title">
          ${getThoughtGroupTitle(group)}
        </div>

        <div class="thought-group-info">
          ${group.length}개의 기록 ·
          ${formatThoughtDate(group[0].id)}
          →
          ${formatThoughtDate(group[group.length-1].id)}
        </div>

        <div class="thought-flow"></div>

        <div class="thought-change-summary">
          🧩 ${escapeHtml(
            summarizeThoughtChange(group)
          )}
        </div>
      `;

      const flow =
        box.querySelector(
          '.thought-flow'
        );

      group.forEach(
        (memo,index) => {

          const card =
            document.createElement('div');

          card.className =
            'thought-card';

          const directCount =
            getManualLinkedIds(memo)
              .filter(
                id =>
                  savedMemos.some(
                    item =>
                      item.id === id
                  )
              )
              .length;

          card.innerHTML = `
            <div class="thought-card-date">
              ${formatThoughtDate(memo.id)}

              ${
                index === group.length - 1
                  ? '<span style="color:#137333;margin-left:5px;">● 최근 기록</span>'
                  : ''
              }
            </div>

            <div class="thought-card-text">
              ${escapeHtml(memo.text)}
            </div>

            <div class="thought-card-category">
              ${escapeHtml(
                memo.category || '#미분류'
              )}

              ${
                memo.tag
                  ? ' · ' + escapeHtml(memo.tag)
                  : ''
              }
            </div>

            <div class="thought-link-info">
              ${escapeHtml(
                getConnectionTypeLabel(
                  memo,
                  group
                )
              )}

              ${
                directCount
                  ? ` · 직접 연결 ${directCount}개`
                  : ''
              }
            </div>

            <div class="thought-card-actions">

              <button
                class="thought-action-btn primary"
                data-action="link"
              >
                🔗 연결하기
              </button>

              ${
                directCount
                  ? `
                    <button
                      class="thought-action-btn connected"
                      data-action="unlink"
                    >
                      🔓 연결 관리
                    </button>
                  `
                  : ''
              }

              <button
                class="thought-action-btn"
                data-action="reply"
              >
                💭 이 생각은 어떻게 달라졌나요?
              </button>

            </div>
          `;

          card.addEventListener(
            'click',
            event => {

              if (
                event.target.closest('button')
              ) {
                return;
              }

              const index =
                savedMemos.findIndex(
                  item =>
                    item.id === memo.id
                );

              if (index !== -1) {
                openMemoModal(index);
              }

            }
          );

          card
            .querySelector(
              '[data-action="link"]'
            )
            .onclick =
            event => {

              event.stopPropagation();

              openLinkMemoModal(
                memo.id
              );

            };

          const unlinkButton =
            card.querySelector(
              '[data-action="unlink"]'
            );

          if (unlinkButton) {

            unlinkButton.onclick =
              event => {

                event.stopPropagation();

                openLinkMemoModal(
                  memo.id
                );

              };

          }

          card
            .querySelector(
              '[data-action="reply"]'
            )
            .onclick =
            event => {

              event.stopPropagation();

              openThoughtReplyPrompt(
                memo.id
              );

            };

          flow.appendChild(card);

          if (
            index <
            group.length - 1
          ) {

            const arrow =
              document.createElement(
                'div'
              );

            arrow.className =
              'thought-arrow';

            arrow.textContent =
              '↓';

            flow.appendChild(
              arrow
            );

          }

        }
      );

      container.appendChild(box);

    }
  );

  /*
    자동으로 연결되지 않은 메모도
    생각의 흐름 화면에서 확인 가능
  */

  const groupedIds =
    new Set(
      groups
        .flat()
        .map(memo => memo.id)
    );

  const ungrouped =
    savedMemos
      .filter(
        memo =>
          !groupedIds.has(memo.id)
      )
      .sort(
        (a,b) =>
          b.id - a.id
      );

  if (
    ungrouped.length
  ) {

    const section =
      document.createElement('div');

    section.className =
      'thought-group';

    section.innerHTML = `
      <div class="thought-group-title">
        🗒️ 아직 흐름에 들어가지 않은 기록
      </div>

      <div class="thought-group-info">
        자동으로 연결되지 않았거나 아직 직접 연결하지 않은 메모예요.
      </div>

      <div class="thought-flow"></div>
    `;

    const flow =
      section.querySelector(
        '.thought-flow'
      );

    ungrouped.forEach(
      memo => {

        const card =
          document.createElement('div');

        card.className =
          'thought-card';

        card.innerHTML = `
          <div class="thought-card-date">
            ${formatThoughtDate(memo.id)}
          </div>

          <div class="thought-card-text">
            ${escapeHtml(memo.text)}
          </div>

          <div class="thought-card-category">
            ${escapeHtml(
              memo.category || '#미분류'
            )}
          </div>

          <div class="thought-card-actions">

            <button
              class="thought-action-btn primary"
              data-action="link"
            >
              🔗 이 기록 연결하기
            </button>

            <button
              class="thought-action-btn"
              data-action="reply"
            >
              💭 이어서 생각하기
            </button>

          </div>
        `;

        card.addEventListener(
          'click',
          event => {

            if (
              event.target.closest('button')
            ) {
              return;
            }

            const index =
              savedMemos.findIndex(
                item =>
                  item.id === memo.id
              );

            if (index !== -1) {
              openMemoModal(index);
            }

          }
        );

        card
          .querySelector(
            '[data-action="link"]'
          )
          .onclick =
          event => {

            event.stopPropagation();

            openLinkMemoModal(
              memo.id
            );

          };

        card
          .querySelector(
            '[data-action="reply"]'
          )
          .onclick =
          event => {

            event.stopPropagation();

            openThoughtReplyPrompt(
              memo.id
            );

          };

        flow.appendChild(card);

      }
    );

    container.appendChild(
      section
    );

  }

}


/* =====================================================
   직접 메모 연결
   ===================================================== */

function openLinkMemoModal(
  memoId
) {

  const target =
    savedMemos.find(
      memo =>
        memo.id === memoId
    );

  if (!target) {
    return;
  }

  linkingMemoId =
    memoId;

  const title =
    String(target.text);

  document.getElementById(
    'linkModalTitle'
  ).textContent =
    `🔗 「${
      title.length > 18
        ? title.slice(0,18) + '…'
        : title
    }」 연결하기`;

  const list =
    document.getElementById(
      'linkMemoList'
    );

  list.innerHTML = '';

  const others =
    [...savedMemos]
      .filter(
        memo =>
          memo.id !== memoId
      )
      .sort(
        (a,b) =>
          b.id - a.id
      );

  if (!others.length) {

    list.innerHTML = `
      <div class="thought-empty" style="margin:0;">
        연결할 다른 메모가 아직 없어요.
      </div>
    `;

  } else {

    others.forEach(
      memo => {

        const label =
          document.createElement(
            'label'
          );

        label.className =
          'link-memo-option';

        const checkbox =
          document.createElement(
            'input'
          );

        checkbox.type =
          'checkbox';

        checkbox.value =
          memo.id;

        checkbox.checked =
          getManualLinkedIds(
            target
          ).includes(
            memo.id
          );

        const text =
          document.createElement(
            'div'
          );

        text.className =
          'link-memo-option-text';

        text.innerHTML = `
          <div class="link-memo-option-main">
            ${escapeHtml(memo.text)}
          </div>

          <div class="link-memo-option-meta">
            ${formatThoughtDate(memo.id)}
            ·
            ${escapeHtml(
              memo.category || '#미분류'
            )}
          </div>
        `;

        label.appendChild(
          checkbox
        );

        label.appendChild(
          text
        );

        list.appendChild(
          label
        );

      }
    );

  }

  document.getElementById(
    'linkMemoModalOverlay'
  ).style.display = 'flex';

}


function closeLinkMemoModal() {

  document.getElementById(
    'linkMemoModalOverlay'
  ).style.display = 'none';

  linkingMemoId = null;

}


function saveMemoLinks() {

  if (
    linkingMemoId === null
  ) {
    return;
  }

  const target =
    savedMemos.find(
      memo =>
        memo.id ===
        linkingMemoId
    );

  if (!target) {
    closeLinkMemoModal();
    return;
  }

  const checked =
    [
      ...document.querySelectorAll(
        '#linkMemoList input[type="checkbox"]:checked'
      )
    ]
      .map(
        checkbox =>
          Number(checkbox.value)
      );

  /*
    양방향 연결로 저장
  */

  savedMemos.forEach(
    memo => {

      if (
        !Array.isArray(
          memo.linkedMemos
        )
      ) {
        memo.linkedMemos = [];
      }

      if (
        memo.id === linkingMemoId
      ) {

        memo.linkedMemos =
          checked.filter(
            id =>
              id !== memo.id
          );

      } else {

        memo.linkedMemos =
          memo.linkedMemos.filter(
            id =>
              id !== linkingMemoId
          );

        if (
          checked.includes(
            memo.id
          )
        ) {

          memo.linkedMemos.push(
            linkingMemoId
          );

        }

        memo.linkedMemos =
          [
            ...new Set(
              memo.linkedMemos
            )
          ];

      }

    }
  );

  saveMemos();

  closeLinkMemoModal();

  renderThoughtFlow();

}


/* =====================================================
   기록 모으기
   ===================================================== */

function collectThoughtRecords() {

  normalizeMemoData();

  saveMemos();

  renderThoughtFlow();

}


/* =====================================================
   생각의 변화 이어쓰기
   ===================================================== */

function openThoughtReplyPrompt(
  parentId
) {

  const parent =
    savedMemos.find(
      memo =>
        memo.id === parentId
    );

  if (!parent) {
    return;
  }

  const text =
    prompt(
      `「${parent.text}」\n\n` +
      `이 생각은 어떻게 달라졌나요?\n` +
      `새롭게 생각한 내용을 적어주세요.`
    );

  if (
    !text ||
    !text.trim()
  ) {
    return;
  }

  const newMemo = {
    id: createMemoId(),
    text: text.trim(),
    category:
      parent.category || '#미분류',
    tag:
      parent.tag || '',
    linkedMemos: [
      parent.id
    ],
    replyTo:
      parent.id
  };

  savedMemos.push(
    newMemo
  );

  if (
    !Array.isArray(
      parent.linkedMemos
    )
  ) {
    parent.linkedMemos = [];
  }

  if (
    !parent.linkedMemos.includes(
      newMemo.id
    )
  ) {

    parent.linkedMemos.push(
      newMemo.id
    );

  }

  saveMemos();

  renderWritePage();
  renderCategoryPage();
  renderAllMemosPage();

  renderThoughtFlow();

}


/* =====================================================
   생각 흐름 새로고침
   ===================================================== */

function refreshThoughtFlow() {

  try {

    const latest =
      JSON.parse(
        localStorage.getItem(
          'notepound_memos'
        )
      );

    if (
      Array.isArray(latest)
    ) {

      savedMemos =
        latest;

      normalizeMemoData();

    }

  } catch (error) {

    console.log(
      '메모를 다시 불러오는 중 문제가 발생했습니다.'
    );

  }

  renderThoughtFlow();

}


/* =====================================================
   초기 실행
   ===================================================== */

renderWritePage();
renderCategoryPage();
renderAllMemosPage();

</script>
